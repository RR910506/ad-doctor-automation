services:
  - type: web
    name: ad-doctor
    runtime: python
    rootDir: ad_doctor
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    disk:
      name: ad-doctor-data
      mountPath: /opt/render/project/src/ad_doctor_data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AD_DOCTOR_DATABASE_PATH
        value: /opt/render/project/src/ad_doctor_data/ad_doctor.db
      - key: AD_DOCTOR_APP_SCHEDULER_ENABLED
        value: "1"
      - key: AD_DOCTOR_SCHEDULER_POLL_SECONDS
        value: "60"
      - key: AD_DOCTOR_SCHEDULER_CATCHUP_HOURS
        value: "12"
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: PERPLEXITY_MODEL
        value: sonar-pro
      - key: PERPLEXITY_ENDPOINT
        value: https://api.perplexity.ai/v1/sonar
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AD_DOCTOR_SMTP_HOST
        sync: false
      - key: AD_DOCTOR_SMTP_PORT
        value: "587"
      - key: AD_DOCTOR_SMTP_USERNAME
        sync: false
      - key: AD_DOCTOR_SMTP_PASSWORD
        sync: false
      - key: AD_DOCTOR_SMTP_FROM
        sync: false
      - key: AD_DOCTOR_SMTP_USE_TLS
        value: "1"
