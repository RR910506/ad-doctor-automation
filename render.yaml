services:
  - type: web
    name: ad-doctor
    runtime: python
    rootDir: ad_doctor
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python start_render.py
    healthCheckPath: /_stcore/health
    disk:
      name: ad-doctor-data
      mountPath: /opt/render/project/src/ad_doctor_data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AD_DOCTOR_DATABASE_PATH
        value: /opt/render/project/src/ad_doctor_data/ad_doctor.db
      - key: AD_DOCTOR_DRAFT_STORE
        value: google
      - key: AD_DOCTOR_CLEAR_SQLITE_GENERATED_DATA_FOR_GOOGLE
        value: "0"
      - key: AD_DOCTOR_APP_SCHEDULER_ENABLED
        value: "0"
      - key: AD_DOCTOR_SCHEDULER_MODE
        value: worker
      - key: AD_DOCTOR_SCHEDULER_POLL_SECONDS
        value: "30"
      - key: AD_DOCTOR_SCHEDULER_CATCHUP_HOURS
        value: "24"
      - key: AD_DOCTOR_WORKER_STALE_SECONDS
        value: "900"
      - key: AD_DOCTOR_JOB_TIMEOUT_SECONDS
        value: "10800"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRAFTS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_DRAFTS_WORKSHEET_NAME
        value: Drafts
      - key: GOOGLE_DRAFTS_FOLDER_ID
        sync: false
      - key: AD_DOCTOR_SMTP_HOST
        sync: false
      - key: AD_DOCTOR_SMTP_PORT
        value: "587"
      - key: AD_DOCTOR_SMTP_USERNAME
        sync: false
      - key: AD_DOCTOR_SMTP_PASSWORD
        sync: false
      - key: AD_DOCTOR_SMTP_FROM
        sync: false
      - key: AD_DOCTOR_SMTP_USE_TLS
        value: "1"
