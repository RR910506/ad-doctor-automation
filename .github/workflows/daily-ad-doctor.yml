name: Daily Ad Doctor Automation

on:
  workflow_dispatch:
  schedule:
    # 09:15 Asia/Kolkata. The app schedule defaults to 09:00, so this gives
    # the due-slot claim a small buffer while staying predictable.
    - cron: "45 3 * * *"

permissions:
  contents: write

concurrency:
  group: daily-ad-doctor-automation
  cancel-in-progress: false

jobs:
  run-daily-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ad_doctor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ad_doctor/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily automation
        env:
          AD_DOCTOR_DATABASE_PATH: database/ad_doctor.db
          AD_DOCTOR_APP_SCHEDULER_ENABLED: "0"
          AD_DOCTOR_SCHEDULER_MODE: external
          AD_DOCTOR_SCHEDULER_CATCHUP_HOURS: "48"
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          PERPLEXITY_MODEL: ${{ vars.PERPLEXITY_MODEL || 'sonar-pro' }}
          PERPLEXITY_ENDPOINT: ${{ vars.PERPLEXITY_ENDPOINT || 'https://api.perplexity.ai/v1/sonar' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m src.daily_automation_runner

      - name: Commit generated database updates
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ad_doctor/database/ad_doctor.db
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update daily Ad Doctor drafts [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Trigger Render deploy hook
        working-directory: .
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "No Render deploy hook configured; relying on Render auto-deploy."
          else
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
          fi
