name: Ad Doctor scheduled automation

on:
  workflow_dispatch:
    inputs:
      run_now:
        description: Run immediately instead of checking the saved daily schedule
        type: boolean
        default: false
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: ad-doctor-private-automation
  cancel-in-progress: false

jobs:
  automate:
    if: ${{ vars.AD_DOCTOR_AUTOMATION_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ad_doctor
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
      OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REQUEST_RUN_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.run_now }}
    steps:
      - uses: actions/checkout@v4
      - name: Check schedule before installing the application
        id: due
        run: python3 automation_schedule_probe.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.due.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ad_doctor/requirements.txt
      - name: Install application and browser
        if: steps.due.outputs.ready == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check shared schedule and run
        if: steps.due.outputs.ready == 'true'
        env:
          AD_DOCTOR_DRAFT_STORE: sqlite
          AD_DOCTOR_CLEAR_SQLITE_GENERATED_DATA_FOR_GOOGLE: '0'
          AD_DOCTOR_APP_SCHEDULER_ENABLED: '0'
          AD_DOCTOR_COLLECTION_DATABASE: /tmp/ad-doctor-collection.db
        run: |
          if [ "$REQUEST_RUN_NOW" = 'true' ]; then
            python automation_worker.py --force
          else
            python automation_worker.py
          fi
